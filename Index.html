<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apps Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #060709;
      --surface: #0d0f14;
      --accent: #00e5ff;
    }
    body { background: var(--bg); font-family: 'DM Sans', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .surface { background: var(--surface); }
    .btn { min-height: 40px; }
    .dot-on  { box-shadow: 0 0 10px 1px rgba(34,197,94,.7); }
  </style>
</head>
<body class="text-slate-200 min-h-screen">
  <div class="max-w-5xl mx-auto px-4 py-8">
    <header class="flex items-center justify-between mb-8">
      <div>
        <h1 class="text-2xl font-bold tracking-tight">Apps Manager</h1>
        <p class="text-sm text-slate-500">Continuous Deployment · Hetzner</p>
      </div>
      <button id="refresh" class="btn mono text-sm px-4 rounded-lg border border-slate-700 hover:border-[color:var(--accent)] hover:text-[color:var(--accent)] transition">
        ↻ Aktualisieren
      </button>
    </header>

    <div id="error" class="hidden mb-4 rounded-lg border border-red-800 bg-red-950/40 px-4 py-3 text-sm text-red-300"></div>

    <div class="surface rounded-xl border border-slate-800 p-6 mb-8">
      <h2 class="text-md font-semibold text-[color:var(--accent)] mb-4 mono uppercase tracking-wider">+ Neue App anbinden</h2>
      <form id="add-form" class="grid grid-cols-1 md:grid-cols-5 gap-4 items-end">
        <div>
          <label class="block text-xs text-slate-500 uppercase mono mb-1">App ID (z.B. scanhub)</label>
          <input type="text" id="form-id" required placeholder="kleingeschrieben" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200 focus:outline-none focus:border-[color:var(--accent)]">
        </div>
        <div>
          <label class="block text-xs text-slate-500 uppercase mono mb-1">Anzeigename</label>
          <input type="text" id="form-name" required placeholder="Mein Service" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200 focus:outline-none focus:border-[color:var(--accent)]">
        </div>
        <div class="md:col-span-2">
          <label class="block text-xs text-slate-500 uppercase mono mb-1">Git-Repository (HTTPS/SSH)</label>
          <input type="text" id="form-repo" required placeholder="https://github.com/user/repo.git" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200 focus:outline-none focus:border-[color:var(--accent)]">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs text-slate-500 uppercase mono mb-1">Port</label>
            <input type="number" id="form-port" required placeholder="5000" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200 focus:outline-none focus:border-[color:var(--accent)]">
          </div>
          <div>
            <label class="block text-xs text-slate-500 uppercase mono mb-1">Branch</label>
            <input type="text" id="form-branch" placeholder="main" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200 focus:outline-none focus:border-[color:var(--accent)]">
          </div>
        </div>
        <div class="md:col-span-5 flex justify-end mt-2">
          <button type="submit" class="btn px-6 rounded-md bg-[color:var(--accent)] text-slate-900 font-bold hover:opacity-90 transition text-sm">
            Repository binden & deployen
          </button>
        </div>
      </form>
    </div>

    <div class="surface rounded-xl border border-slate-800 overflow-hidden">
      <table class="w-full text-sm">
        <thead class="text-left text-slate-500 border-b border-slate-800 mono text-xs uppercase tracking-wider">
          <tr>
            <th class="px-4 py-3">System</th>
            <th class="px-4 py-3">Status</th>
            <th class="px-4 py-3">Port</th>
            <th class="px-4 py-3">Branch</th>
            <th class="px-4 py-3 text-right">Aktionen</th>
          </tr>
        </thead>
        <tbody id="rows" class="divide-y divide-slate-800/60">
          <tr><td colspan="5" class="px-4 py-8 text-center text-slate-500">Lade …</td></tr>
        </tbody>
      </table>
    </div>

    <p id="hint" class="mt-4 text-xs text-slate-600 mono"></p>
  </div>

  <script>
    const $rows  = document.getElementById('rows');
    const $error = document.getElementById('error');
    const $hint  = document.getElementById('hint');

    function statusBadge(s) {
      const map = {
        running: ['bg-green-500 dot-on', 'läuft'],
        exited:  ['bg-red-500',          'gestoppt'],
        paused:  ['bg-amber-500',        'pausiert'],
        created: ['bg-slate-500',        'erstellt'],
        missing: ['bg-slate-600',        'fehlt'],
        error:   ['bg-red-700',          'Fehler'],
      };
      const [color, label] = map[s] || ['bg-slate-600', s];
      return `<span class="inline-flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full ${color}"></span>
                <span class="mono text-xs">${label}</span>
              </span>`;
    }

    function showError(msg) {
      $error.textContent = msg;
      $error.classList.remove('hidden');
    }

    async function load() {
      $error.classList.add('hidden');
      try {
        const res = await fetch('/api/systems');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        render(data.systems || []);
      } catch (e) {
        showError('Konnte Systeme nicht laden: ' + e.message);
        $rows.innerHTML = '';
      }
    }

    function render(systems) {
      if (!systems.length) {
        $rows.innerHTML = '<tr><td colspan="5" class="px-4 py-8 text-center text-slate-500">Keine Apps in der Verwaltung</td></tr>';
        return;
      }
      $rows.innerHTML = systems.map(s => `
        <tr class="hover:bg-slate-800/30">
          <td class="px-4 py-3 font-medium">${s.name}<div class="mono text-xs text-slate-500">${s.id}</div></td>
          <td class="px-4 py-3">${statusBadge(s.status)}</td>
          <td class="px-4 py-3 mono text-slate-400">${s.port ?? '—'}</td>
          <td class="px-4 py-3 mono text-slate-400">${s.branch ?? '—'}</td>
          <td class="px-4 py-3">
            <div class="flex gap-2 justify-end">
              <button class="btn px-3 rounded-md bg-green-600/20 text-green-300 hover:bg-green-600/30 transition" data-act="start"  data-id="${s.id}">Start</button>
              <button class="btn px-3 rounded-md bg-red-600/20 text-red-300 hover:bg-red-600/30 transition"     data-act="stop"   data-id="${s.id}">Stopp</button>
              <button class="btn px-3 rounded-md bg-[color:var(--accent)]/10 text-[color:var(--accent)] hover:bg-[color:var(--accent)]/20 transition" data-act="update" data-id="${s.id}">Update</button>
              <button class="btn px-3 rounded-md bg-red-950/40 text-red-400 border border-red-900/60 hover:bg-red-900/40 transition" data-act="delete" data-id="${s.id}">✕</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    // Aktionen (Event-Delegation)
    $rows.addEventListener('click', async (ev) => {
      const btn = ev.target.closest('button[data-act]');
      if (!btn) return;
      const { act, id } = btn.dataset;
      
      if (act === 'delete' && !confirm(`Möchtest du die App '${id}' wirklich entfernen? Ordner/Container bleiben unangetastet.`)) return;
      
      btn.disabled = true;
      const old = btn.textContent;
      btn.textContent = '…';
      try {
        let res;
        if (act === 'delete') {
          res = await fetch(`/api/systems/${id}`, { method: 'DELETE' });
        } else {
          res = await fetch(`/api/systems/${id}/${act}`, { method: 'POST' });
        }
        
        const body = await res.json();
        if (!res.ok) throw new Error(body.detail || ('HTTP ' + res.status));
        $hint.textContent = `${act} → ${id}: ok`;
        if (act === 'update') $hint.textContent += ' (Build läuft im Hintergrund)';
        load();
      } catch (e) {
        showError(`${act} fehlgeschlagen (${id}): ${e.message}`);
      } finally {
        btn.disabled = false;
        btn.textContent = old;
        setTimeout(load, act === 'update' ? 2500 : 800);
      }
    });

    // Event-Listener für das Erstellungs-Formular
    document.getElementById('add-form').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      $error.classList.add('hidden');
      $hint.textContent = 'Binde Repository an...';
      
      const payload = {
        id: document.getElementById('form-id').value,
        name: document.getElementById('form-name').value,
        repo_url: document.getElementById('form-repo').value,
        port: document.getElementById('form-port').value,
        branch: document.getElementById('form-branch').value
      };

      try {
        const res = await fetch('/api/systems', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const body = await res.json();
        if (!res.ok) throw new Error(body.detail || 'Fehler beim Hinzufügen');
        
        document.getElementById('add-form').reset();
        $hint.textContent = 'App erfolgreich hinzugefügt! Initialer Build läuft im Hintergrund...';
        load();
      } catch (e) {
        showError('Fehler: ' + e.message);
        $hint.textContent = '';
      }
    });

    document.getElementById('refresh').addEventListener('click', load);
    load();
    setInterval(load, 15000);
  </script>
</body>
</html>
